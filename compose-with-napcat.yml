# One-click deployment: AstrBot (built natively from this repo) + NapCat.
#
# Usage (after `git clone` of this repo):
#   docker compose -f compose-with-napcat.yml up -d --build
#
# On Linux, match NapCat's file ownership to your host user to avoid permission issues:
#   NAPCAT_UID=$(id -u) NAPCAT_GID=$(id -g) docker compose -f compose-with-napcat.yml up -d --build
#
# Ports:
#   6185 -> AstrBot WebUI         (http://localhost:6185)
#   6099 -> NapCat WebUI          (http://localhost:6099)
# AstrBot and NapCat reach each other inside `astrbot_network` by container name,
# so no QQ WebSocket port needs to be published to the host.
# NapCat follows the upstream `latest` tag and is re-pulled on every
# `docker compose up`; pin a tag and digest when you need reproducibility.

services:
  # AstrBot, built from this checkout and sharing runtime state with NapCat.
  astrbot:
    build:
      context: . # Build this checkout instead of pulling an image.
      dockerfile: Dockerfile # Root Dockerfile.
      target: runtime # Production runtime stage.
      args:
        # Runtime feature groups; `full` enables every group. See the Docker docs.
        ASTRBOT_FEATURES: '${ASTRBOT_FEATURES:-full}'
    image: astrbot:local # Local tag for the image produced by `build`.
    restart: always # Restart unless the operator stops the container.
    init: true # Forward signals and reap orphaned child processes.
    ports:
      # Host ports bind to loopback by default. Set ASTRBOT_BIND_ADDRESS=0.0.0.0
      # only with a firewall or reverse proxy in front of the WebUI.
      - '${ASTRBOT_BIND_ADDRESS:-127.0.0.1}:6185:6185' # AstrBot WebUI
    environment:
      TZ: '${TZ:-Asia/Shanghai}' # Container timezone.
      # The container must listen on all interfaces for the published port to work.
      ASTRBOT_DASHBOARD_HOST: '0.0.0.0'
    volumes:
      - ./data:/AstrBot/data # Config, database, plugins, and runtime state.
      - /var/run/docker.sock:/var/run/docker.sock # Docker control for the computer tool.
    networks:
      - astrbot_network # Internal network shared with NapCat.
    healthcheck:
      # Liveness probe used by NapCat's depends_on condition below.
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:6185/healthz', timeout=3)
      interval: 30s # Probe every 30 seconds.
      timeout: 5s # Fail a probe after 5 seconds.
      retries: 3 # Mark unhealthy after three consecutive failures.
      start_period: 30s # Ignore failures during the first 30 seconds.

  # NapCat provides the QQ protocol endpoint. It is not built from this repo.
  napcat:
    # Follow the upstream `latest` tag and re-check it on every `docker compose up`.
    image: mlikiowa/napcat-docker:latest
    pull_policy: always # Re-check the tag on every `docker compose up`.
    restart: always # Restart unless the operator stops the container.
    # NapCat's desktop/QQ runtime requires the same full-capability profile.
    privileged: true
    init: true # Forward signals and reap orphaned child processes.
    environment:
      # Match the host UID/GID to reduce bind-mount permission problems.
      - NAPCAT_UID=${NAPCAT_UID:-1000}
      - NAPCAT_GID=${NAPCAT_GID:-1000}
      # MODE=astrbot makes NapCat write a reverse WebSocket client to AstrBot.
      - MODE=astrbot
    ports:
      # Loopback-only by default; set NAPCAT_BIND_ADDRESS to expose it.
      - '${NAPCAT_BIND_ADDRESS:-127.0.0.1}:6099:6099' # NapCat WebUI
    volumes:
      - ./data:/AstrBot/data # Shared AstrBot data path.
      - ./napcat/config:/app/napcat/config # NapCat OneBot configuration.
      - ./ntqq:/app/.config/QQ # QQ login state.
    depends_on:
      astrbot:
        condition: service_healthy # Start NapCat after AstrBot is live.
    networks:
      - astrbot_network

networks:
  # Private bridge so the two containers resolve each other by service name.
  astrbot_network:
    driver: bridge
