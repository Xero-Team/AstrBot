<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title|e }}</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      background: #ffffff;
    }

    body {
      min-width: 320px;
      margin: 0;
      padding: 16px;
      color: #202224;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* qq-chat-exporter light bubble, without avatar/branding. */
    .forward-bubble {
      display: block;
      max-width: 100%;
      padding: 9px 14px;
      border-radius: 16px;
      background: rgba(0, 0, 0, 0.04);
      color: #202224;
      word-wrap: break-word;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    /* Card markup and rules mirror qq-chat-exporter modern_css.css. */
    .forward-card {
      min-width: min(280px, 70vw);
      max-width: 100%;
      padding: 2px 0;
      margin: 2px 0;
      color: inherit;
    }

    .forward-card-header {
      display: flex;
      align-items: center;
      margin-bottom: 9px;
      font-size: 15px;
      font-weight: 600;
      color: inherit;
    }

    .forward-card-content {
      font-size: 14px;
      line-height: 1.55;
    }

    .forward-card-line + .forward-card-line {
      margin-top: 5px;
    }

    .forward-card-sender {
      font-weight: 600;
      color: inherit;
      opacity: 0.9;
    }

    .forward-card-body {
      color: inherit;
      opacity: 0.7;
    }

    .forward-card-image {
      display: block;
      max-width: 320px;
      max-height: 260px;
      margin-top: 6px;
      border-radius: 8px;
      object-fit: cover;
    }

    /* Nested forwards indent under a left rule, always fully expanded. */
    .forward-card-line.is-nested {
      border-left: 1px solid rgba(32, 34, 36, 0.18);
    }

    .forward-card-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      margin-top: 10px;
      font-size: 12px;
      color: inherit;
      opacity: 0.68;
    }
  </style>
</head>
<body>
  <div class="forward-bubble">
    <div class="forward-card">
      <div class="forward-card-header">
        <span>{{ title|e }}</span>
      </div>
      <div class="forward-card-content">
        {% for row in rows %}
        <div class="forward-card-line{% if row.depth %} is-nested{% endif %}"{% if row.depth %} style="margin-left: {{ row.depth * 14 }}px; padding-left: 10px;"{% endif %}><span class="forward-card-sender">{{ row.name|e }}:</span>{% if row.text %}<span class="forward-card-body">{{ row.text|e }}</span>{% endif %}{% for image in row.get('images', []) %}<img class="forward-card-image" src="{{ image|e }}" alt="" />{% endfor %}</div>
        {% endfor %}
      </div>
      <div class="forward-card-footer">{{ footer|e }}</div>
    </div>
  </div>
</body>
</html>
