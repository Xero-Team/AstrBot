default_install_hook_types: [pre-commit, prepare-commit-msg]
ci:
  autofix_commit_msg: ':balloon: auto fixes by pre-commit hooks'
  autofix_prs: true
  autoupdate_branch: master
  autoupdate_schedule: weekly
  autoupdate_commit_msg: ':balloon: pre-commit autoupdate'
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.15.22
    hooks:
      # Run the linter.
      - id: ruff-check
        types_or: [python, pyi]
        args: [--fix]
      # Run the formatter.
      - id: ruff-format
        types_or: [python, pyi]

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        # --py314-plus would strip `from __future__ import annotations`
        # (pyupgrade removes it when min_version >= 3.14), but the runtime
        # still evaluates protocol stub annotations eagerly
        # (tests/unit/test_protocol_function_coverage.py via get_type_hints),
        # so the import must stay. --py313-plus upgrades everything up to
        # 3.13 syntax without treating PEP 563 as redundant.
        args: [--py313-plus]
