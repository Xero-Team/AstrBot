name: Unit Tests

on:
  push:
    branches:
      - master
      - staging
    paths-ignore:
      - 'README*.md'
      - 'changelogs/**'
      - 'dashboard/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-tests:
    name: Run blocking pytest suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Windows hosted runners can take longer than 30 minutes for the full
    # blocking suite. Keep the cross-platform lane from being cancelled before
    # pytest can report its result.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    # Windows stays continue-on-error so a Windows-only flake does not
    # block the required Ubuntu/macOS lanes. The Windows blocking suite
    # is currently green; promote it to a hard gate after it stays green
    # on master.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}

    defaults:
      run:
        # Windows runners default to pwsh; use bash so the same steps and
        # test script work on all three platforms.
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14.6'

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv

      - name: Run tests
        run: |
          chmod +x scripts/run_pytests_ci.sh
          bash ./scripts/run_pytests_ci.sh --test-profile blocking
