    preview (8fed6250, 4da9ff20); profile mapping async serialization
    (0670787b); full-area chat drag uploads (fa2e2339); favicon plugin
    defaults (fd81cb23); platform send-result typing alignment
    (dd38c3c4); assistant history encoding for responses (cf13b375);
    upstream platform sync (bae3e67d); CI Dependabot cadence and security
    audit dependency bumps (77005563, 1e4a779e, 9850a40f); and the
    upstream fork's own sync-record commit (e2f2e98d). Zephirum's BTW
    dual-loop (conversation/work) feature was preserved unchanged; the
    upstream parallel-tool-execution dispatch and the fork's
    `_filter_handoff_toolset_for_btw` routing touch disjoint regions and
    coexist. Conflict resolution favored upstream for
    request_preparation.py (wider media Literal and retained
    `from __future__`), the webchat/wecomai send_streaming line wrapping,
    and the dashboard pnpm workspace/lockfile (js-yaml 4.3.1 plus the
    upstream-added nanoid 3.3.17 override); tests/unit/test_config.py kept
    both the BTW route-assignment and the platform-template tests. The
    `upstream.repo` field continues to point at AstrBotDevs/AstrBot per
    fork convention even though this sync pulled from Xero-Team/AstrBot;
    Zephirum operates as an independent fork and does not open PRs back
    to either upstream.
