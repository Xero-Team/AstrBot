name: 'AstrBot CodeQL config'

# Noise reduction for GitHub Code Scanning. This config only filters CodeQL
# query output; it does not change product behavior or disable the workflow.
# The workflow still runs `+security-extended,security-and-quality`; these
# filters apply to that combined set, so security-severity findings stay
# visible. See Issue #293.
query-filters:
  # Every open `py/ineffectual-statement` finding in product code is the `...`
  # body of a `typing.Protocol` method (e.g. `astrbot/core/agent/chat_model.py`,
  # `astrbot/core/db/protocols.py`); there is no source-side fix that keeps the
  # stubs. It is a note-severity code-quality query with no security severity,
  # and CodeQL `query-filters` cannot be scoped to a path, so the whole query is
  # excluded. Test-tree findings are already dropped by `paths-ignore` below.
  - exclude:
      id: py/ineffectual-statement

# Test sources are not product surfaces. Covers `tests/**` and
# `dashboard/tests/**`.
paths-ignore:
  - '**/tests/**'
