name: Container Runtime

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/container-runtime.yml'
      - 'scripts/check_container_runtime.py'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'dashboard/**'
      - 'docs/**'
      - 'astrbot/**'
      - 'main.py'
      - 'runtime_bootstrap.py'
  push:
    branches: [master, staging]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/container-runtime.yml'
      - 'scripts/check_container_runtime.py'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'dashboard/**'
      - 'docs/**'
      - 'astrbot/**'
      - 'main.py'
      - 'runtime_bootstrap.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  runtime:
    name: Runtime (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimal
            features: minimal
          - name: browser-node
            features: browser,node
          - name: full
            features: full
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build runtime image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          target: runtime
          build-args: ASTRBOT_FEATURES=${{ matrix.features }}
          tags: astrbot-runtime:${{ matrix.name }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify runtime commands
        run: >-
          python3 scripts/check_container_runtime.py
          --image astrbot-runtime:${{ matrix.name }}
          --features ${{ matrix.features }}
