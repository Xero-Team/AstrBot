  note: >-
    Merged the Xero-Team/AstrBot sibling fork (remote `upstream`, tip
    fa399cb09) into Zephirum via a single merge commit, bringing in 117
    commits diverged since the previous marker 1e4a779e. The interval mixes
    AstrBotDevs PRs (listed in source_pr) with the sibling fork's own
    adaptation and sync commits, so source_pr lists only the PR-numbered
    entries. Major upstream features: a unified authorization system with
    per-action role checks and dashboard step-up for high-risk operations;
    dashboard account identity with authoritative TOTP state in its
    database; MCP SDK 2 protocol with stable, collision-free MCP tool
    names; NapCat OneBot versioned contracts and chunked uploads; a group
    message history tool; an SSYCloud provider; a managed shell-session
    tool; selectable Docker feature builds; and an upstream-sync skill.
    BTW was preserved and adapted where upstream intersected it. The 4
    textual conflicts were resolved as follows: internal.py combined the
    BTW detached-work follow-up guard with upstream's agent stop-callback
    registry; docs/en and docs/zh took upstream's reflowed top-level table
    and the updated dashboard/computer-use/admins_id notes while keeping
    the fork's `btw` row and BTW dual-loop section; upstream-sync.yaml was
    rewritten for this merge. Semantic adaptations beyond the textual
    conflicts: added upstream's new ShellSessionTool to
    `_CONVERSATION_FORBIDDEN_TOOL_TYPES` so the conversation loop's
    computer/filesystem isolation backstop stays complete; taught the
    unified authorization gate to treat an explicitly engaged BTW work
    loop as an elevation equivalent to dashboard step-up, so IM operators
    can run high-risk `tool.*` actions (shell, computer, file, browser) in
    the work loop while the role check still restricts them to
    operators/root and non-tool high-risk actions stay dashboard-only; and
    updated the BTW MCP tool test fixtures to the SDK 2 `mcp.types.Tool`
    shape and the new deterministic MCP tool-name allocator. The
    `upstream.repo` field continues to point at AstrBotDevs/AstrBot per
    fork convention even though this sync pulled from Xero-Team/AstrBot;
    Zephirum operates as an independent fork and does not open PRs back
    to either upstream.
