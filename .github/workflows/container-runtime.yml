name: Container Runtime

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/container-runtime.yml'
      - 'scripts/check_container_runtime.py'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'dashboard/**'
      - 'docs/**'
      - 'astrbot/**'
      - 'main.py'
      - 'runtime_bootstrap.py'
  push:
    branches: [master, staging]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/container-runtime.yml'
      - 'scripts/check_container_runtime.py'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'dashboard/**'
      - 'docs/**'
      - 'astrbot/**'
      - 'main.py'
      - 'runtime_bootstrap.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  runtime:
    name: Runtime (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimal
            features: minimal
          - name: browser-node
            features: browser,node
          - name: full
            features: full
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          target: runtime
          build-args: ASTRBOT_FEATURES=${{ matrix.features }}
          tags: astrbot-runtime:${{ matrix.name }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify runtime commands
        run: >-
          python3 scripts/check_container_runtime.py
          --image astrbot-runtime:${{ matrix.name }}
          --features ${{ matrix.features }}
